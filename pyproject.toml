[tool.pytest.ini_options]
# `tests` on the path is what lets a test say `from clients import ApiClients`
# instead of reaching up through relative imports it should not know about.
pythonpath = ["tests"]

# Scoped deliberately. The reason used to be that the application shared this
# repository and shipped a module called test_utils.py that collection would try
# to import. That is gone with the split, but the setting stays: it keeps
# collection out of .venv and any future tooling directory, and it makes a bare
# `pytest` mean the same thing here as the explicit invocation does in CI.
testpaths = ["tests"]

addopts = [
  "-ra",                                 # summarise every non-passing outcome
  "--strict-markers",                    # a typo'd marker fails, rather than silently matching nothing
  "--strict-config",                     # same for this file
  "--alluredir=reports/allure-results",
]

markers = [
  "smoke: fast critical-path gate",
  "regression: full suite",
  "api: API layer",
  "ui: browser",
  "e2e: BDD journeys",
  "contract: OpenAPI schema validation",
  "destructive: needs exclusive database state",
  # Claimed by a test, not inferred: the deployed-smoke job runs -m readonly
  # against the live demo, so a test wearing this marker is promising it
  # creates and mutates nothing. Tests get tagged when that job is built.
  "readonly: safe against a shared or deployed environment",
  # Pure functions with no application involved — the guards that protect the
  # suite itself. They need no server, so they run anywhere.
  "unit: no application required",
  "slow: over 10 seconds",
]

# Captured logs appear under a failing test, which is usually enough to
# diagnose it without rerunning with -s.
log_cli = false
log_level = "INFO"
log_format = "%(asctime)s %(levelname)-5s %(name)s | %(message)s"
log_date_format = "%H:%M:%S"

# A DeprecationWarning is a scheduled future failure, so it is an error here.
#
# This used to read `error::DeprecationWarning:tests.*`, which was silently
# inactive: the third field is a regex matched against the module that raises
# the warning, and with `pythonpath = ["tests"]` the suite imports as
# `api_tests.*`, `clients.*`, `config.*` — never `tests.*`. It matched nothing
# and therefore enforced nothing, which is worse than having no rule, because
# the file claimed a guarantee that was not there.
#
# Unscoped now, deliberately. Naming our own packages would reintroduce the same
# failure: a package added later would fall outside the list and be silently
# exempt. If a dependency starts emitting one, add an explicit ignore below it
# with a note — visible, and revisited when the dependency is upgraded.
filterwarnings = ["error::DeprecationWarning"]
